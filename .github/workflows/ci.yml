name: content-gates

# 内容门禁 CI：任何推送到 main 的改动都必须跑完全部 9 步门禁；
# 构建产物与已提交成品出现漂移（改了题库却没重建就提交）也会被拦下。
# 见《应用化实施方案与迭代计划.md》迭代 0。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: pip install sympy

      - name: Run full gate pipeline (build + 7 verification gates)
        env:
          PYTHONIOENCODING: utf-8
          # 构建产物写到临时目录：默认会落在仓库根目录，污染工作区；
          # 而且**部署用的成品叫 index.html、构建产物叫 01《…》.html**，
          # 两者名字不同，漂移检查必须自己把两者对上（见下一步）。
          QUIZ_PROJECT_DIR: ${{ runner.temp }}/quiz-build
        run: |
          mkdir -p "$QUIZ_PROJECT_DIR"
          python tools/update_site.py --no-stage

      - name: Fail on drift (committed index.html != freshly built product)
        env:
          # ① 内容层：已提交成品里的题库必须与源码一致
          #    （diff_bank.py 比对源码 qa_bank 与 $QUIZ_HTML 里的内联题库）
          QUIZ_HTML: index.html
          #    env 不跨 step 传递，② 要用同一个构建目录，必须在这里再写一遍
          QUIZ_PROJECT_DIR: ${{ runner.temp }}/quiz-build
        run: |
          set -e
          python tools/diff_bank.py
          # ② 字节层：已提交的 index.html 必须**就是**按当前源码构建出来的那个文件
          #    --strip-trailing-cr：屏蔽 Windows checkout 的 CRLF 差异（autocrlf 陷阱）
          if ! diff -q --strip-trailing-cr index.html "$QUIZ_PROJECT_DIR/01《线性代数》题库刷题网页.html" > /dev/null; then
            echo "::error::已提交的 index.html 与按当前源码重新构建的结果不一致：改了题库/界面却没重新构建就提交"
            exit 1
          fi
          echo "::notice::已提交成品与按当前源码重建的产物一致（字节级）"

  # ── mcode 渠道核验（2026-11-07 起纳入正式发布流程）─────────────────────────
  # 为什么要有这个 job：
  #   CI 绿 ≠ 线上是最新。CI 只比对**仓内**已提交成品与「按当前源码重建的结果」，
  #   查不到「线上那个 mcode 节点有没有重发过」。
  #   2026-11-01 的 mdLite 修复提交后，GitHub Pages 更新了，
  #   而 mcode 单文件站**整整两天没重发**（线上落后 HEAD 两天）。
  #
  # 这个 job 红 = **mcode 渠道待补发**（不是代码坏了）。
  #   代码健康看 content-gates；mcode 是手动补发渠道，所以这里只报警不阻塞。
  verify-mcode-online:
    name: 线上核验：mcode 渠道是否已跟上 HEAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 判据反向测试（造错必须报错）
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/test_online_judge.py

      - name: 核验 mcode 渠道：线上 == HEAD 成品
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/verify_mcode_online.py --ci --ci-repo publish \
            --root linalg="$GITHUB_WORKSPACE"

      - name: 自证有牙齿：故意注入漂移，核验器必须报红
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p drift-root
          cp index.html drift-root/index.html
          printf 'x' >> drift-root/index.html
          if python tools/verify_mcode_online.py --ci --ci-repo publish --only linalg-single \
               --root linalg="$GITHUB_WORKSPACE/drift-root"; then
            echo "::error::核验器对注入的漂移没有报错 —— 这道门禁没有牙齿"
            exit 1
          fi
          echo "::notice::核验器对注入的漂移正确报错（门禁有牙齿）"
